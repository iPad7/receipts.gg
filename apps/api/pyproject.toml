[project]
name = "receipts-api"
version = "0.1.0"
description = "receipts.gg backend API (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic 이 생성하는 마이그레이션의 CHECK 제약 SQL 은 단일 문자열 리터럴이라
# 포매터가 줄바꿈할 수 없다. 생성 코드에 한해 줄 길이 제한을 면제한다.
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 실제 PostgreSQL 연결이 필요한 테스트",
]

# 모듈러 모놀리스의 경계를 규약이 아니라 CI 로 강제한다 (ADR-0009, SA §4).
[tool.importlinter]
root_package = "receipts_api"
# 외부 패키지(sqlalchemy 등)를 금지 대상으로 지정하려면 필요하다.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "도메인은 SQLAlchemy 를 모른다"
type = "forbidden"
source_modules = ["receipts_api.modules.*.domain"]
forbidden_modules = ["sqlalchemy", "alembic", "fastapi", "pydantic"]

[[tool.importlinter.contracts]]
name = "core 는 도메인 지식을 갖지 않는다"
type = "forbidden"
source_modules = ["receipts_api.core"]
forbidden_modules = ["receipts_api.modules"]

[[tool.importlinter.contracts]]
name = "core 는 웹 프레임워크를 모른다"
type = "forbidden"
source_modules = ["receipts_api.core"]
forbidden_modules = ["fastapi", "starlette"]

# 화이트리스트(fail-closed)로 둔다. `forbidden` 으로 "domain·persistence·service 는 api 를
# import 하지 않는다" 를 쓰면 새 파일 이름이 목록에 없을 때 검사 대상에서 조용히 빠진다.
# 라우터는 그 자체로 Presentation 이므로 `api` 를 쓰는 유일한 자리다.
# 인증 의존성은 여러 모듈이 공유하는 횡단 관심사라 특정 모듈에 둘 수 없다(independence).
[[tool.importlinter.contracts]]
name = "Presentation 과 앱 조립은 라우터·main 만 import 한다"
type = "protected"
protected_modules = [
    "receipts_api.api",
    "receipts_api.main",
    "receipts_api.mappings",
]
allowed_importers = [
    "receipts_api.main",
    "receipts_api.modules.*.router",
]

# 모듈 **내부**의 계층 방향. 위 계약과 직교한다 — 이쪽은 api 를 보지 않고, 저쪽은
# 모듈 내부를 보지 않는다. 괄호는 선택적 계층이라 router·service 가 아직 없는 모듈에서
# 계약이 깨지지 않는다.
[[tool.importlinter.contracts]]
name = "모듈 내부의 계층 방향"
type = "layers"
layers = ["(router)", "(service)", "persistence", "domain"]
containers = [
    "receipts_api.modules.sites",
    "receipts_api.modules.identity",
    "receipts_api.modules.viewers",
    "receipts_api.modules.roulette",
    "receipts_api.modules.rms",
    "receipts_api.modules.audit",
]

# 모듈 간 직접 import 는 0건이다. BE-05 에서 RMS 가 Viewers·Roulette 의 service 를
# 호출해야 하면 이 계약을 모듈별 forbidden 으로 완화하고, 그때 명시적으로 승인받는다.
#
# `independence` 는 **간접 경로까지** 센다(실측). 조립 지점인 api 가 여러 모듈의 service
# 를 호출하므로, 라우터가 api 를 쓰는 순간 "sites.router -> api -> identity.service" 가
# 모듈 간 결합으로 집계된다. 모듈러 모놀리스에서 조립 지점이 전부를 아는 것은 설계대로이고
# 모듈 사이의 결합이 아니므로 그 경로만 제외한다. 모듈 간 **직접** import 는 그대로 막힌다
# (돌연변이 검사로 확인).
[[tool.importlinter.contracts]]
name = "모듈은 서로 독립이다"
type = "independence"
ignore_imports = ["receipts_api.api.** -> receipts_api.modules.**"]
modules = [
    "receipts_api.modules.sites",
    "receipts_api.modules.identity",
    "receipts_api.modules.viewers",
    "receipts_api.modules.roulette",
    "receipts_api.modules.rms",
    "receipts_api.modules.audit",
]
